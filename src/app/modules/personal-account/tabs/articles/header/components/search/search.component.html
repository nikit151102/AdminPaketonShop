<!-- search.component.html -->
<div class="search-container">
  <!-- Основная строка поиска -->
  <div class="search-bar">
    <div class="search-bar__wrapper">
      <!-- Иконка поиска -->
      <svg class="search-bar__icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <path
          d="M21 21L16.65 16.65M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>

      <!-- Поле ввода -->
      <input #searchInput type="text" class="search-bar__input" placeholder="Поиск товаров..."
       [attr.aria-label]="'Поиск'" />




      <!-- Кнопка поиска -->
      <button class="search-bar__submit" aria-label="Найти">
        Найти
      </button>
    </div>

  
  </div>

</div>
